<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="WDF live classes">
  <meta name="theme-color" content="#ffffff">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="WDF Classes">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>
  <link rel="manifest" href="manifest.json">
  <title>WDF Classes</title>
  <style>
    html, body { margin: 0; height: 100%; background: #ffffff; }
    /* Shown instantly while the Flutter engine downloads; removed on first frame. */
    #splash {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 20px;
      font: 600 22px -apple-system, system-ui, Roboto, "Helvetica Neue", sans-serif;
      color: #222222; transition: opacity .2s;
    }
    #splash .dot {
      width: 56px; height: 56px; border-radius: 50%; background: #ff385c;
      animation: pulse 1s ease-in-out infinite alternate;
    }
    @keyframes pulse { from { transform: scale(.8); opacity: .6; } to { transform: scale(1); opacity: 1; } }
  </style>
</head>
<body>
  <div id="splash"><div class="dot"></div>WDF Classes</div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var s = document.getElementById('splash');
      if (s) { s.style.opacity = '0'; setTimeout(function () { s.remove(); }, 200); }
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
